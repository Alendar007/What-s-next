<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>What's next ?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    html, body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-tap-highlight-color: transparent;
    }

    /* Layout principal */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Barre latérale ultra-fine avec largeur et contraction fixes */
    .sidebar {
      width: 42px;
      min-width: 42px;
      max-width: 42px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 20px;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Élément du menu : se déplie de gauche à droite au survol sans écraser le reste */
    .sidebar-item {
      position: relative;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      color: var(--muted);
      cursor: pointer;
      border-radius: 0 10px 10px 0;
      overflow: hidden;
      white-space: nowrap;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, color 0.2s;
    }
    .sidebar-item:hover, .sidebar-item.active {
      width: 170px;
      color: #fff;
      background: rgba(99, 102, 241, 0.25);
      box-shadow: 4px 0 15px rgba(0,0,0,0.4);
      z-index: 1002;
    }

    /* Icône fixe à gauche */
    .sidebar-icon {
      min-width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sidebar-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Texte du module révélé au déploiement et masqué au repli */
    .sidebar-text {
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.15s ease;
      padding-left: 2px;
    }
    .sidebar-item:hover .sidebar-text,
    .sidebar-item.active .sidebar-text {
      opacity: 1;
      transition: opacity 0.2s ease 0.05s;
    }

    /* Zone de contenu principale */
    .main-content {
      flex: 1;
      padding: 30px;
      box-sizing: border-box;
      min-width: 0; /* Empêche le contenu de forcer le redimensionnement */
    }

    /* Vues / Modules */
    .view {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
    }
    .view.active {
      display: block;
    }

    /* Page d'accueil : Grand titre sans encart */
    .welcome-container {
      text-align: center;
      margin-top: 80px;
      padding: 0 20px;
    }
    .welcome-container h2 {
      color: #fff;
      font-size: 56px;
      font-weight: 900;
      margin: 0 0 16px 0;
      letter-spacing: -2px;
    }
    .welcome-container p {
      color: var(--muted);
      font-size: 18px;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <nav class="sidebar">
      <!-- Accueil (Icône forme de goutte d'eau / repère) -->
      <div class="sidebar-item active" id="btn-home" onclick="switchView('home', this)">
        <div class="sidebar-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <span class="sidebar-text">Accueil</span>
      </div>

      <!-- Animes & Mangas (Icône Cinéma) -->
      <div class="sidebar-item" id="btn-anime" onclick="switchView('anime', this)">
        <div class="sidebar-icon">
          <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zM4 18V8h16v10H4z"/></svg>
        </div>
        <span class="sidebar-text">Animes & Mangas</span>
      </div>
    </nav>

    <main class="main-content">
      <div id="home" class="view">
        <div class="welcome-container">
          <h2>What's next ?</h2>
          <p>Sélectionne un module via le menu à gauche.</p>
        </div>
      </div>

      <div id="anime" class="view">
        <iframe src="modules/animes_mangas.html" style="width: 100%; height: 88vh; border: none; background: transparent;"></iframe>
      </div>
    </main>
  </div>

  <script>
    function switchView(viewId, element, save = true) {
      document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      if (save) {
        localStorage.setItem('activeView', viewId);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedView = localStorage.getItem('activeView');
      if (savedView && document.getElementById(savedView)) {
        const targetBtn = document.getElementById('btn-' + savedView);
        if (targetBtn) {
          switchView(savedView, targetBtn, false);
        }
      } else {
        switchView('home', document.getElementById('btn-home'), false);
      }
    });
  </script>

</body>
</html>
