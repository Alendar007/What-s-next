<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>What's next ?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-format: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    
    .site-header { text-align: center; margin-bottom: 24px; }
    h1 { color: #fff; font-size: 26px; margin: 0 0 6px 0; }
    .site-subtitle { color: var(--muted); font-size: 14px; font-weight: 500; }
    
    .search-box { display: flex; gap: 10px; position: relative; margin-bottom: 20px; }
    select, input { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: #fff; font-size: 15px; outline: none; }
    select { width: 110px; flex-shrink: 0; }
    input { flex: 1; width: 100%; box-sizing: border-box; }
    
    .btn-reset {
      background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 0 14px;
      border-radius: 8px; cursor: pointer; font-size: 16px; display: none; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-reset:hover { color: #fff; border-color: var(--accent); }
    
    .autocomplete-list {
      position: absolute; top: 100%; left: 120px; right: 50px; margin-top: 4px;
      background: var(--card-bg); border: 1px solid var(--accent); border-radius: 8px;
      max-height: 250px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    @media (max-width: 500px) { .autocomplete-list { left: 0; right: 0; } }
    .autocomplete-item { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: var(--accent); }

    .hero-banner { background: transparent; padding: 10px 0 20px 0; display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 550px) { .hero-banner { flex-direction: column; text-align: center; } }
    
    .hero-avatar { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; background: var(--card-bg); flex-shrink: 0; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; }
    .hero-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
    
    .hero-info h2 { margin: 0 0 6px 0; color: #fff; font-size: 18px; }
    .hero-quote { font-style: italic; color: var(--accent); margin-bottom: 6px; font-size: 14px; }
    .hero-desc { font-size: 13px; color: var(--muted); line-height: 1.4; }

    .controls-bar { margin-bottom: 20px; display: none; }
    .sort-bar { display: flex; flex-direction: column; gap: 12px; background: var(--card-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
    .sort-control { display: flex; flex-direction: column; gap: 8px; }
    .sort-control label { font-size: 13px; font-weight: bold; color: var(--muted); text-transform: uppercase; }
    .sort-control select { padding: 10px 14px; font-size: 14px; width: 100%; }
    
    .btn-toggle-filters {
      background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 10px 14px;
      border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%;
    }
    .btn-toggle-filters:hover { border-color: var(--accent); }

    .filters-wrapper { background: var(--card-bg); border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; padding: 16px; display: none; }
    .filters-wrapper.open { display: block; }
    .filter-section { margin-bottom: 12px; }
    .filter-section:last-child { margin-bottom: 0; }
    .filter-title { font-size: 12px; font-weight: bold; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .filter-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { background: #0f172a; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .tag-genre.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tag-format.active { background: var(--accent-format); border-color: var(--accent-format); color: #fff; }

    .year-section { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card-bg); }
    .year-header { padding: 14px 16px; background: #1a2332; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .year-header:hover { background: #232d3f; }
    .year-header .count { font-size: 13px; color: var(--muted); font-weight: normal; }
    .year-content { padding: 16px; display: none; }
    .year-section.open .year-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .year-section.open .arrow { transform: rotate(180deg); }
    .arrow { transition: transform 0.2s; font-size: 12px; }
    .flat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }

    .card { background: #0f172a; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card-img-wrapper { width: 100%; height: 220px; overflow: hidden; background: #1e293b; }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 10px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #fff; }
    .card-format-badge { display: inline-block; align-self: flex-start; font-size: 10px; font-weight: bold; background: #334155; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; }
    .card-genres { font-size: 10px; color: var(--accent); margin-bottom: 8px; }
    .card-meta { font-size: 11px; color: var(--muted); margin-top: auto; }

    .modal-backdrop { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); 
      display: flex; justify-content: center; align-items: flex-end; 
      z-index: 200; padding: 0; box-sizing: border-box;
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-backdrop.show { opacity: 1; visibility: visible; }
    
    .modal-card { 
      background: var(--card-bg); border: 1px solid var(--border); border-bottom: none;
      border-radius: 20px 20px 0 0; max-width: 650px; width: 100%; max-height: 90vh; 
      position: relative; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
      transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .modal-backdrop.show .modal-card { transform: translateY(0); }
    
    @media (min-width: 600px) {
      .modal-backdrop { align-items: center; padding: 16px; }
      .modal-card { border-radius: 12px; border-bottom: 1px solid var(--border); max-height: 85vh; }
    }

    .modal-handle-area { width: 100%; padding: 16px 0; display: flex; justify-content: center; cursor: grab; position: sticky; top: 0; background: var(--card-bg); z-index: 10; border-radius: 20px 20px 0 0; touch-action: none; }
    .drag-handle { width: 48px; height: 6px; background: #475569; border-radius: 4px; }
    
    .modal-scrollable { overflow-y: auto; padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
    @media (min-width: 550px) { .modal-scrollable { flex-direction: row; } }
    
    .modal-cover { width: 140px; border-radius: 8px; object-fit: cover; align-self: flex-start; }
    .modal-info { flex: 1; }
    .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; color: #fff; }
    .modal-description { font-size: 12px; line-height: 1.5; color: #cbd5e1; margin: 12px 0; max-height: 140px; overflow-y: auto; }
    .modal-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn-link { background: var(--accent); color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; }

    .status { text-align: center; margin-top: 20px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="site-header">
    <h1>What's next ?</h1>
    <div class="site-subtitle">Animés & Mangas</div>
  </div>

  <div class="search-box">
    <select id="mediaType">
      <option value="ANIME">Anime</option>
      <option value="MANGA">Manga</option>
    </select>
    <input type="text" id="searchInput" placeholder="Titre puis Entrée (ex: Bleach...)" autocomplete="off">
    <button id="resetBtn" class="btn-reset" title="Retour à l'accueil">⌂</button>
    <div id="autocompleteList" class="autocomplete-list"></div>
  </div>

  <div id="heroBanner" class="hero-banner">
    <div class="hero-avatar" id="heroAvatar"></div>
    <div class="hero-info">
      <h2 id="heroName">Chargement...</h2>
      <div id="heroQuote" class="hero-quote"></div>
      <div id="heroDesc" class="hero-desc"></div>
    </div>
  </div>

  <div id="controlsBar" class="controls-bar">
    <div class="sort-bar">
      <div class="sort-control">
        <label for="sortMode">Trier les recommandations par :</label>
        <select id="sortMode">
          <option value="YEAR_DESC">📅 Année (récent ➔ ancien)</option>
          <option value="SCORE_DESC">⭐ Meilleure note</option>
        </select>
      </div>
      <button id="toggleFiltersBtn" class="btn-toggle-filters">⚙️ Plus de filtres</button>
    </div>

    <div id="filtersWrapper" class="filters-wrapper">
      <div class="filter-section">
        <div class="filter-title">Formats :</div>
        <div id="formatTags" class="filter-tags"></div>
      </div>
      <div class="filter-section" style="margin-top: 14px;">
        <div class="filter-title">Genres :</div>
        <div id="genreTags" class="filter-tags"></div>
      </div>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="resultsContainer"></div>
</div>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal-card" id="modalCard">
    <div class="modal-handle-area" id="modalHandleArea">
      <div class="drag-handle"></div>
    </div>
    <div class="modal-scrollable">
      <img id="modalImg" class="modal-cover" src="" alt="Cover">
      <div class="modal-info">
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalMeta" style="font-size: 12px; color: var(--muted);"></div>
        <div id="modalGenres" style="font-size: 11px; color: var(--accent); margin-top: 6px;"></div>
        <div id="modalDesc" class="modal-description"></div>
        <div style="font-size: 12px; font-weight: bold; color: var(--muted); margin-bottom: 6px;">Plateformes & Liens :</div>
        <div id="modalLinks" class="modal-links"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const ANILIST_URL = 'https://graphql.anilist.co';

  const HERO_POOL = [
    { name: "Satoru Gojo", quote: "« Ne t'inquiète pas, je suis le plus fort. »", desc: "Sélectionne n'importe quelle série pour générer son graphe de recommandation.", id: 127448 },
    { name: "Faye Valentine", quote: "« Tu sais ce qu'on dit : à la guerre comme à la guerre ! »", desc: "Tape un titre dans la barre ci-dessus pour dénicher des œuvres similaires.", id: 2 },
    { name: "Asuka Langley", quote: "« Quoi ? Tu n'as toujours pas choisi d'anime à rechercher ?! »", desc: "Trouve immédiatement des recommandations basées sur les votes de la communauté.", id: 1211 },
    { name: "Lelouch vi Britannia", quote: "« Si le roi ne bouge pas, ses sujets ne le suivront pas. »", desc: "Prépare-toi à découvrir des pépites scénaristiques inoubliables.", id: 45 },
    { name: "Levi Ackerman", quote: "« Le seul choix qu'il nous reste est de croire en nous-mêmes. »", desc: "Filtre par notes et par années pour cibler direct tes prochains visionnages.", id: 45942 },
    { name: "Monkey D. Luffy", quote: "« Je serai le roi des pirates ! »", desc: "Explore des milliers de suggestions adaptées à tes goûts.", id: 40 },
    { name: "Tanjiro Kamado", quote: "« Ne baisse jamais les bras, même si c'est dur. »", desc: "Trouve ta prochaine claque visuelle en quelques secondes.", id: 128443 },
    { name: "Light Yagami", quote: "« Je suis la justice ! »", desc: "Déniche des thrillers psychologiques d'exception.", id: 80 }
  ];

  const searchInput = document.getElementById('searchInput');
  const mediaType = document.getElementById('mediaType');
  const resetBtn = document.getElementById('resetBtn');
  const autocompleteList = document.getElementById('autocompleteList');
  
  const heroBanner = document.getElementById('heroBanner');
  const heroAvatar = document.getElementById('heroAvatar');
  const heroName = document.getElementById('heroName');
  const heroQuote = document.getElementById('heroQuote');
  const heroDesc = document.getElementById('heroDesc');

  const controlsBar = document.getElementById('controlsBar');
  const toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
  const filtersWrapper = document.getElementById('filtersWrapper');
  const sortMode = document.getElementById('sortMode');
  const formatTags = document.getElementById('formatTags');
  const genreTags = document.getElementById('genreTags');
  const resultsContainer = document.getElementById('resultsContainer');
  const status = document.getElementById('status');

  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalCard = document.getElementById('modalCard');
  const modalHandleArea = document.getElementById('modalHandleArea');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalMeta = document.getElementById('modalMeta');
  const modalGenres = document.getElementById('modalGenres');
  const modalDesc = document.getElementById('modalDesc');
  const modalLinks = document.getElementById('modalLinks');

  let rawRecommendations = [];
  let selectedGenres = new Set();
  let selectedFormats = new Set();
  let debounceTimer;

  async function initHero() {
    try {
      const selected = HERO_POOL[Math.floor(Math.random() * HERO_POOL.length)];
      
      heroQuote.innerText = selected.quote;
      heroDesc.innerText = selected.desc;
      heroAvatar.innerHTML = '<span style="font-size:24px">🐈‍⬛</span>';
      
      const query = `
        query ($id: Int) {
          Character (id: $id) {
            name { full }
            image { large }
            media(perPage: 1, sort: POPULARITY_DESC) {
              nodes { title { romaji english } }
            }
          }
        }
      `;
      const response = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { id: selected.id } })
      });
      const data = await response.json();
      const char = data.data.Character;

      if (char) {
        const mediaNode = char.media.nodes[0];
        const animeTitle = mediaNode ? (mediaNode.title.english || mediaNode.title.romaji) : '';
        heroName.innerText = animeTitle ? `${char.name.full} (${animeTitle})` : char.name.full;
        
        if (char.image && char.image.large) {
          heroAvatar.innerHTML = '';
          const img = document.createElement('img');
          img.alt = char.name.full;
          img.src = char.image.large;
          heroAvatar.appendChild(img);
        }
      } else {
        heroName.innerText = selected.name;
      }

      heroBanner.style.display = 'flex';
      resetBtn.style.display = 'none';
    } catch (e) {
      console.error(e);
      heroName.innerText = "Bienvenue";
    }
  }
  initHero();

  resetBtn.addEventListener('click', () => {
    searchInput.value = '';
    resultsContainer.innerHTML = '';
    controlsBar.style.display = 'none';
    status.innerText = '';
    initHero();
  });

  let startY = 0;
  let currentY = 0;
  let isDragging = false;

  function onDragStart(e) {
    startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    isDragging = true;
    modalCard.style.transition = 'none';
  }

  function onDragMove(e) {
    if (!isDragging) return;
    const y = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    currentY = y - startY;
    if (currentY > 0) modalCard.style.transform = `translateY(${currentY}px)`;
  }

  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    modalCard.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)';
    if (currentY > 120) closeModal();
    else modalCard.style.transform = '';
    currentY = 0;
  }

  modalHandleArea.addEventListener('touchstart', onDragStart, {passive: true});
  modalHandleArea.addEventListener('touchmove', onDragMove, {passive: true});
  modalHandleArea.addEventListener('touchend', onDragEnd);
  modalHandleArea.addEventListener('mousedown', onDragStart);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);

  function openModal(item) {
    const title = item.title.english || item.title.romaji;
    modalImg.src = item.coverImage.large;
    modalTitle.innerText = title;
    
    const yearText = item.startDate && item.startDate.year ? item.startDate.year : 'N/A';
    const fmt = item.format ? item.format.replace('_', ' ') : 'N/A';
    modalMeta.innerText = `Format : ${fmt} | Année : ${yearText} | ⭐ Note : ${item.averageScore || 'N/A'}/100`;
    modalGenres.innerText = (item.genres || []).join(' • ');
    
    modalDesc.innerText = item.description ? item.description.replace(/<[^>]*>?/gm, '') : 'Aucune description disponible.';

    modalLinks.innerHTML = `<a href="${item.siteUrl}" target="_blank" class="btn-link">Fiche AniList</a>`;
    if (item.externalLinks && item.externalLinks.length > 0) {
      item.externalLinks.forEach(link => {
        const btn = document.createElement('a');
        btn.className = 'btn-link';
        btn.href = link.url;
        btn.target = '_blank';
        btn.innerText = link.site;
        modalLinks.appendChild(btn);
      });
    }

    modalCard.style.transform = ''; 
    modalBackdrop.classList.add('show');
  }

  function closeModal() {
    modalBackdrop.classList.remove('show');
    setTimeout(() => { modalCard.style.transform = ''; }, 350); 
  }

  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });

  toggleFiltersBtn.addEventListener('click', () => {
    filtersWrapper.classList.toggle('open');
    toggleFiltersBtn.innerText = filtersWrapper.classList.contains('open') ? '⚙️ Masquer les filtres' : '⚙️ Plus de filtres';
  });

  sortMode.addEventListener('change', () => {
    if (rawRecommendations.length > 0) renderResults();
  });

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = searchInput.value.trim();
    if (query.length < 2) {
      autocompleteList.style.display = 'none';
      return;
    }
    debounceTimer = setTimeout(() => fetchTitles(query, mediaType.value), 300);
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (autocompleteList.style.display === 'block' && autocompleteList.firstChild) {
        autocompleteList.firstChild.click();
      } else if (query.length >= 2) {
        directSearch(query, mediaType.value);
      }
    }
  });

  document.addEventListener('click', (e) => {
    if (e.target !== searchInput) autocompleteList.style.display = 'none';
  });

  async function fetchTitles(search, type) {
    const query = `
      query ($search: String, $type: MediaType) {
        Page(perPage: 6) {
          media(search: $search, type: $type) {
            id
            title { english romaji }
            format
            startDate { year }
          }
        }
      }
    `;
    try {
      const response = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { search, type } })
      });
      const data = await response.json();
      const items = data.data.Page.media;

      autocompleteList.innerHTML = '';
      if (items && items.length > 0) {
        items.forEach(item => {
          const title = item.title.english || item.title.romaji;
          const year = item.startDate && item.startDate.year ? `(${item.startDate.year})` : '';
          const div = document.createElement('div');
          div.className = 'autocomplete-item';
          div.innerHTML = `<span><strong>${title}</strong></span> <small style="color:#94a3b8">${item.format || ''} ${year}</small>`;
          div.onclick = () => {
            searchInput.value = title;
            autocompleteList.style.display = 'none';
            loadRecommendations(item.id, title);
          };
          autocompleteList.appendChild(div);
        });
        autocompleteList.style.display = 'block';
      } else {
        autocompleteList.style.display = 'none';
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function directSearch(search, type) {
    status.innerText = `Recherche de "${search}"...`;
    autocompleteList.style.display = 'none';
    const query = `
      query ($search: String, $type: MediaType) {
        Media(search: $search, type: $type) {
          id
          title { english romaji }
        }
      }
    `;
    try {
      const response = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { search, type } })
      });
      const data = await response.json();
      const media = data.data.Media;
      
      if (media) {
        const title = media.title.english || media.title.romaji;
        searchInput.value = title;
        loadRecommendations(media.id, title);
      } else {
        status.innerText = `Aucun résultat exact trouvé pour "${search}".`;
      }
    } catch (err) {
      status.innerText = "Erreur de connexion.";
      console.error(err);
    }
  }

  async function loadRecommendations(id, title) {
    heroBanner.style.display = 'none';
    resetBtn.style.display = 'flex';
    status.innerText = `Chargement des recommandations pour "${title}"...`;
    resultsContainer.innerHTML = '';
    controlsBar.style.display = 'none';
    selectedGenres.clear();
    selectedFormats.clear();

    const query = `
      query ($id: Int) {
        Media (id: $id) {
          recommendations(perPage: 35, sort: RATING_DESC) {
            nodes {
              mediaRecommendation {
                id
                title { english romaji }
                coverImage { large }
                siteUrl
                averageScore
                format
                genres
                description(asHtml: false)
                startDate { year }
                externalLinks { site url }
              }
            }
          }
        }
      }
    `;

    try {
      const response = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { id } })
      });
      const data = await response.json();
      const nodes = data.data.Media.recommendations.nodes;

      status.innerText = '';
      rawRecommendations = nodes
        .map(n => n.mediaRecommendation)
        .filter(rec => rec !== null);

      if (rawRecommendations.length === 0) {
        status.innerText = 'Aucune recommandation disponible sur AniList pour ce titre.';
        return;
      }

      setupFilterControls();
      renderResults();
    } catch (err) {
      status.innerText = 'Erreur lors du chargement des données.';
      console.error(err);
    }
  }

  function setupFilterControls() {
    const formatsSet = new Set();
    const genresSet = new Set();

    rawRecommendations.forEach(item => {
      if (item.format) formatsSet.add(item.format);
      (item.genres || []).forEach(g => genresSet.add(g));
    });

    formatTags.innerHTML = '';
    Array.from(formatsSet).sort().forEach(fmt => {
      const btn = document.createElement('div');
      btn.className = 'tag tag-format';
      btn.innerText = fmt.replace('_', ' ');
      btn.onclick = () => {
        if (selectedFormats.has(fmt)) {
          selectedFormats.delete(fmt);
          btn.classList.remove('active');
        } else {
          selectedFormats.add(fmt);
          btn.classList.add('active');
        }
        renderResults();
      };
      formatTags.appendChild(btn);
    });

    genreTags.innerHTML = '';
    Array.from(genresSet).sort().forEach(genre => {
      const btn = document.createElement('div');
      btn.className = 'tag tag-genre';
      btn.innerText = genre;
      btn.onclick = () => {
        if (selectedGenres.has(genre)) {
          selectedGenres.delete(genre);
          btn.classList.remove('active');
        } else {
          selectedGenres.add(genre);
          btn.classList.add('active');
        }
        renderResults();
      };
      genreTags.appendChild(btn);
    });

    controlsBar.style.display = 'block';
  }

  function renderResults() {
    resultsContainer.innerHTML = '';
    const filtered = rawRecommendations.filter(item => {
      const matchFormat = selectedFormats.size === 0 || selectedFormats.has(item.format);
      const itemGenres = item.genres || [];
      const matchGenre = selectedGenres.size === 0 || Array.from(selectedGenres).every(g => itemGenres.includes(g));
      return matchFormat && matchGenre;
    });

    if (filtered.length === 0) {
      resultsContainer.innerHTML = '<div class="status">Aucune œuvre ne correspond aux filtres choisis.</div>';
      return;
    }

    if (sortMode.value === 'YEAR_DESC') {
      renderByYear(filtered);
    } else {
      renderByScore(filtered);
    }
  }

  function renderByYear(itemsList) {
    const grouped = {};
    itemsList.forEach(item => {
      const year = item.startDate && item.startDate.year ? item.startDate.year : 'Inconnue';
      if (!grouped[year]) grouped[year] = [];
      grouped[year].push(item);
    });

    const sortedYears = Object.keys(grouped).sort((a, b) => {
      if (a === 'Inconnue') return 1;
      if (b === 'Inconnue') return -1;
      return b - a;
    });

    sortedYears.forEach((year, index) => {
      const items = grouped[year];
      const section = document.createElement('div');
      section.className = `year-section ${index === 0 ? 'open' : ''}`;

      const header = document.createElement('div');
      header.className = 'year-header';
      header.innerHTML = `
        <span>📅 ${year} <span class="count">(${items.length})</span></span>
        <span class="arrow">▼</span>
      `;
      header.onclick = () => section.classList.toggle('open');

      const content = document.createElement('div');
      content.className = 'year-content';
      items.forEach(item => content.appendChild(createCard(item)));

      section.appendChild(header);
      section.appendChild(content);
      resultsContainer.appendChild(section);
    });
  }

  function renderByScore(itemsList) {
    const sorted = [...itemsList].sort((a, b) => (b.averageScore || 0) - (a.averageScore || 0));
    const grid = document.createElement('div');
    grid.className = 'flat-grid';
    sorted.forEach(item => grid.appendChild(createCard(item)));
    resultsContainer.appendChild(grid);
  }

  function createCard(item) {
    const title = item.title.english || item.title.romaji;
    const genresText = (item.genres || []).slice(0, 3).join(', ');
    const fmtBadge = item.format ? item.format.replace('_', ' ') : 'N/A';
    const yearText = item.startDate && item.startDate.year ? item.startDate.year : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(item);
    
    card.innerHTML = `
      <div class="card-img-wrapper"><img src="${item.coverImage.large}" alt="${title}"></div>
      <div class="card-body">
        <span class="card-format-badge">${fmtBadge} ${yearText ? '• ' + yearText : ''}</span>
        <div class="card-title">${title}</div>
        <div class="card-genres">${genresText}</div>
        <div class="card-meta">⭐ Note : ${item.averageScore || 'N/A'}/100</div>
      </div>
    `;
    return card;
  }
</script>

</body>
</html>
