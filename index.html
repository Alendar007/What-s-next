<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>What's next ?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <!-- Favicon chat en SVG pur : 0 fond blanc, 100% transparent et net -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2218%22>🐈‍⬛</text></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    html, body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      height: 100%;
      /* Permet le scroll natif et le pull-to-refresh sur mobile */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-tap-highlight-color: transparent;
    }

    /* En-tête avec le nom du site centré */
    .top-header {
      height: 45px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 1001;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .top-header h1 {
      color: #fff;
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Layout principal */
    .app-layout {
      display: flex;
      min-height: calc(100vh - 45px);
    }

    /* Sidebar ultra-fine */
    .sidebar {
      width: 44px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 10px;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Élément du menu : largeur fixe par défaut, s'élargit strictement au survol de la souris */
    .sidebar-item {
      position: relative;
      width: 44px;
      height: 40px;
      display: flex;
      align-items: center;
      color: var(--muted);
      cursor: pointer;
      border-radius: 0 8px 8px 0;
      transition: background 0.2s, color 0.2s;
    }
    .sidebar-item:hover, .sidebar-item.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.2);
    }

    /* Icône fixe */
    .sidebar-icon {
      width: 44px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* Texte masqué par défaut, apparaît uniquement au survol et disparaît instantanément ensuite */
    .sidebar-text {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-width 0.25s ease, opacity 0.2s ease;
    }
    .sidebar-item:hover .sidebar-text {
      max-width: 140px;
      opacity: 1;
      padding-right: 12px;
    }

    /* Zone de contenu principale */
    .main-content {
      flex: 1;
      padding: 16px;
      box-sizing: border-box;
    }

    /* Vues / Modules */
    .view {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
    }
    .view.active {
      display: block;
    }

    /* Page d'accueil par défaut */
    .welcome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      margin-top: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .welcome-card h2 { color: #fff; margin-top: 0; }
  </style>
</head>
<body>

  <header class="top-header">
    <h1>What's next ?</h1>
  </header>

  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-item active" id="btn-home" onclick="switchView('home', this)">
        <div class="sidebar-icon">🐈‍⬛</div>
        <span class="sidebar-text">Accueil</span>
      </div>

      <div class="sidebar-item" id="btn-anime" onclick="switchView('anime', this)">
        <div class="sidebar-icon">🎬</div>
        <span class="sidebar-text">Animes & Mangas</span>
      </div>
    </nav>

    <main class="main-content">
      <div id="home" class="view">
        <div class="welcome-card">
          <h2>Bienvenue sur ton tableau de bord</h2>
          <p style="color: var(--muted);">Survole l'icône du clap à gauche pour lancer le module.</p>
        </div>
      </div>

      <div id="anime" class="view">
        <iframe src="modules/animes_mangas.html" style="width: 100%; height: 80vh; border: none; background: transparent;"></iframe>
      </div>
    </main>
  </div>

  <script>
    function switchView(viewId, element, save = true) {
      document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      if (save) {
        localStorage.setItem('activeView', viewId);
      }
    }

    // Restaure le module actif au rechargement
    window.addEventListener('DOMContentLoaded', () => {
      const savedView = localStorage.getItem('activeView');
      if (savedView && document.getElementById(savedView)) {
        const targetBtn = document.getElementById('btn-' + savedView);
        if (targetBtn) {
          switchView(savedView, targetBtn, false);
        }
      } else {
        switchView('home', document.getElementById('btn-home'), false);
      }
    });
  </script>

</body>
</html>
