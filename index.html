<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>What's next ?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* En-tête avec le nom du site centré */
    .top-header {
      height: 50px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1001;
      flex-shrink: 0;
    }
    .top-header h1 {
      color: #fff;
      font-size: 18px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Layout principal (Sidebar à gauche + Contenu) */
    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 50px);
      overflow: hidden;
    }

    /* Sidebar fixe à gauche (petites icônes) */
    .sidebar {
      width: 65px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 10px;
      flex-shrink: 0;
      z-index: 1000;
    }

    /* Chaque élément du menu : s'élargit individuellement au survol */
    .sidebar-item {
      display: flex;
      align-items: center;
      width: 65px;
      height: 50px;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, color 0.2s;
    }
    .sidebar-item:hover, .sidebar-item.active {
      width: 200px; /* Largeur du dépliage au survol */
      color: #fff;
      background: rgba(99, 102, 241, 0.15);
    }

    /* Icône (favicon ou émoji) */
    .sidebar-icon {
      min-width: 65px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .sidebar-icon img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }

    /* Texte masqué par défaut, révélé au survol */
    .sidebar-text {
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s ease 0.1s; /* Petit délai pour la fluidité */
      padding-right: 15px;
    }
    .sidebar-item:hover .sidebar-text, 
    .sidebar-item.active .sidebar-text {
      opacity: 1;
    }

    /* Zone de contenu principale */
    .main-content {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
    }

    /* Vues / Modules */
    .view {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
      height: 100%;
    }
    .view.active {
      display: block;
    }

    /* Style de la page d'accueil par défaut */
    .welcome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-top: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .welcome-card h2 { color: #fff; margin-top: 0; }
  </style>
</head>
<body>

  <!-- En-tête avec le nom du site centré -->
  <header class="top-header">
    <h1>What's next ?</h1>
  </header>

  <div class="app-layout">
    <!-- Barre latérale avec icônes et slider individuel -->
    <nav class="sidebar">
      <div class="sidebar-item active" onclick="switchView('home', this)">
        <div class="sidebar-icon">
          <img src="favicon.png" alt="Accueil">
        </div>
        <span class="sidebar-text">Accueil</span>
      </div>

      <div class="sidebar-item" onclick="switchView('anime', this)">
        <div class="sidebar-icon">🎬</div>
        <span class="sidebar-text">Animes & Mangas</span>
      </div>
    </nav>

    <!-- Contenu principal -->
    <main class="main-content">
      
      <!-- Vue Accueil (Par défaut) -->
      <div id="home" class="view active">
        <div class="welcome-card">
          <h2>Bienvenue sur ton tableau de bord</h2>
          <p style="color: var(--muted);">Survole ou clique sur l'icône de l'appareil photo/clap à gauche pour ouvrir le module.</p>
        </div>
      </div>

      <!-- Vue Module Animes & Mangas -->
      <div id="anime" class="view">
        <iframe src="modules/animes_mangas.html" style="width: 100%; height: 100%; border: none; background: transparent;"></iframe>
      </div>

    </main>
  </div>

  <script>
    function switchView(viewId, element) {
      document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }
  </script>

</body>
</html>
