<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>What's next ?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* En-tête avec le nom du site centré */
    .top-header {
      height: 45px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1001;
      flex-shrink: 0;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .top-header h1 {
      color: #fff;
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Layout principal */
    .app-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 45px);
      overflow: hidden;
    }

    /* Sidebar ultra-fine */
    .sidebar {
      width: 44px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      gap: 8px;
      flex-shrink: 0;
      z-index: 1000;
    }

    /* Élément du menu : s'élargit au survol pour révéler le texte, puis se referme */
    .sidebar-item {
      position: relative;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, color 0.2s;
    }
    .sidebar-item:hover, .sidebar-item.active {
      width: 150px; /* S'élargit uniquement au survol */
      color: #fff;
      background: rgba(99, 102, 241, 0.2);
    }

    /* Icône fixe à gauche de l'item */
    .sidebar-icon {
      min-width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .sidebar-icon img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
      /* Élimine totalement le fond blanc de l'image de la favicon */
      mix-blend-mode: screen;
      filter: brightness(1.2) contrast(150%);
    }

    /* Texte masqué par défaut, apparaît au survol de l'icône */
    .sidebar-text {
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s ease;
      padding-right: 10px;
    }
    .sidebar-item:hover .sidebar-text,
    .sidebar-item.active .sidebar-text {
      opacity: 1;
    }

    /* Zone de contenu principale */
    .main-content {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* Permet le rebond et le pull-to-refresh fluide sur mobile */
      padding: 16px;
      box-sizing: border-box;
    }

    /* Vues / Modules */
    .view {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
      height: 100%;
    }
    .view.active {
      display: block;
    }

    /* Page d'accueil par défaut */
    .welcome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      margin-top: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .welcome-card h2 { color: #fff; margin-top: 0; }
  </style>
</head>
<body>

  <header class="top-header">
    <h1>What's next ?</h1>
  </header>

  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-item active" id="btn-home" onclick="switchView('home', this)">
        <div class="sidebar-icon">
          <img src="favicon.png" alt="Accueil">
        </div>
        <span class="sidebar-text">Accueil</span>
      </div>

      <div class="sidebar-item" id="btn-anime" onclick="switchView('anime', this)">
        <div class="sidebar-icon">🎬</div>
        <span class="sidebar-text">Animes & Mangas</span>
      </div>
    </nav>

    <main class="main-content">
      <div id="home" class="view">
        <div class="welcome-card">
          <h2>Bienvenue sur ton tableau de bord</h2>
          <p style="color: var(--muted);">Survole l'icône du clap à gauche pour lancer le module.</p>
        </div>
      </div>

      <div id="anime" class="view">
        <iframe src="modules/animes_mangas.html" style="width: 100%; height: 100%; border: none; background: transparent;"></iframe>
      </div>
    </main>
  </div>

  <script>
    function switchView(viewId, element, save = true) {
      document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      if (save) {
        localStorage.setItem('activeView', viewId);
      }
    }

    // Restaure le module actif au rechargement de la page pour ne rien perdre
    window.addEventListener('DOMContentLoaded', () => {
      const savedView = localStorage.getItem('activeView');
      if (savedView && document.getElementById(savedView)) {
        const targetBtn = document.getElementById('btn-' + savedView);
        if (targetBtn) {
          switchView(savedView, targetBtn, false);
        }
      } else {
        switchView('home', document.getElementById('btn-home'), false);
      }
    });
  </script>

</body>
</html>
