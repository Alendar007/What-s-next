<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>What's next ? - Accueil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root[data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --accent: #6366f1; --text: #f8fafc; --muted: #94a3b8; --border: #334155; }
    :root[data-theme="light"] { --bg: #f8fafc; --card-bg: #ffffff; --accent: #4f46e5; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }

    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; transition: background 0.3s ease, color 0.3s ease; }
    body { display: flex; flex-direction: row; height: 100vh; }

    /* MENU BARRE LATÉRALE ICONS */
    .sidebar { width: 44px; background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 12px; z-index: 20; flex-shrink: 0; }
    .sidebar-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; font-size: 16px; transition: all 0.2s; }
    .sidebar-btn:hover, .sidebar-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }

    /* ZONE PRINCIPALE */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; overflow: hidden; }
    .container { width: 100%; padding: 12px 12px 8px 12px; flex-shrink: 0; background: var(--bg); z-index: 10; }
    
    .results-scroll-area { flex: 1 1 0%; height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 12px 30px 12px; width: 100%; position: relative; }
    @media (max-width: 600px) { .container { padding: 8px 6px 6px 6px; } .results-scroll-area { padding: 0 6px 20px 6px; } }
    .results-scroll-area::-webkit-scrollbar { width: 5px; }
    .results-scroll-area::-webkit-scrollbar-track { background: transparent; }
    .results-scroll-area::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }

    /* LES CHATS ANIMÉS */
    .cats-banner { display: flex; justify-content: center; align-items: center; gap: 12px; height: 32px; margin-bottom: 4px; }
    .cat-gif { height: 28px; width: auto; }

    /* INDICATEUR PULL TO REFRESH */
    .pull-refresh-indicator { width: 100%; text-align: center; font-size: 12px; color: var(--muted); height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: height 0.2s ease, opacity 0.2s ease; opacity: 0; }
    .pull-refresh-indicator.visible { opacity: 1; }

    .site-header { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 8px; }
    h1 { color: var(--text); font-size: 20px; margin: 0; }
    .site-subtitle { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 2px; }
    
    .type-switch { display: flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px; flex-shrink: 0; flex-wrap: wrap; justify-content: center; gap: 2px; }
    .type-btn { background: transparent; border: none; color: var(--muted); padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .type-btn.active { background: var(--accent); color: #fff; }
    
    .toolbar-layout { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 8px; width: 100%; margin-bottom: 8px; }
    .search-box { display: flex; gap: 6px; position: relative; flex: 1 1 280px; max-width: 480px; min-width: 200px; margin: 0 auto; }
    .toolbar-layout.has-controls .search-box { margin: 0; }

    input { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 13px; outline: none; flex: 1; min-width: 0; width: 100%; height: 36px; }
    .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 0 10px; border-radius: 8px; cursor: pointer; font-size: 13px; display: none; align-items: center; justify-content: center; flex-shrink: 0; height: 36px; transition: color 0.2s, border-color 0.2s; }
    .btn-reset:hover { color: var(--text); border-color: var(--accent); }
    
    .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--card-bg); border: 1px solid var(--accent); border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; }
    .autocomplete-item { padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text); gap: 8px; }
    .autocomplete-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: var(--accent); color: #fff; }

    .year-section { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card-bg); width: 100%; }
    .year-header { padding: 8px 12px; background: var(--card-bg); font-weight: bold; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; color: var(--text); flex-shrink: 0; }
    .year-header:hover { opacity: 0.9; }
    .year-header .count { font-size: 11px; color: var(--muted); font-weight: normal; }
    .year-content { padding: 12px; display: none; border-top: 1px solid var(--border); width: 100%; }
    
    .year-section.open .year-content { display: block; }
    .year-section.open .year-content.grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }

    .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card-img-wrapper { width: 100%; height: 160px; overflow: hidden; background: var(--border); }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 6px 8px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-weight: bold; font-size: 11px; margin-bottom: 2px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-genres { font-size: 9px; color: var(--accent); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .welcome-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; margin-top: 10px; }
    .welcome-title { font-size: 18px; font-weight: bold; color: var(--text); margin: 0; }
    .welcome-text { font-size: 12px; color: var(--muted); line-height: 1.5; max-width: 90%; margin: 0; }

    .status { text-align: center; margin-top: 8px; color: var(--muted); font-size: 12px; }

    /* LAYOUT PAYSAGE COMPACT ACCUEIL */
    @media (orientation: landscape) and (max-height: 500px) {
      .container { padding: 4px 8px 4px 8px; }
      h1, .site-subtitle, .cats-banner { display: none; }
      .site-header { margin-bottom: 0; flex-shrink: 0; }
      .toolbar-layout { margin-bottom: 4px; flex-direction: row; align-items: center; justify-content: space-between; }
      .search-box { margin: 0; flex: 1 1 200px; height: 32px; }
      input { padding: 4px 8px; height: 32px; font-size: 12px; }
      .btn-reset { height: 32px; }
      .type-switch { flex-shrink: 0; }
      .type-btn { padding: 3px 6px; font-size: 10px; }
      .results-scroll-area { padding: 4px 6px 16px 6px; }
    }
  </style>
</head>
<body>

<nav class="sidebar">
  <a href="index.html" class="sidebar-btn active" title="Accueil">🏠</a>
  <a href="games.html" class="sidebar-btn" title="Jeux Vidéo">🎮</a>
  <a href="anime.html" class="sidebar-btn" title="Animés">🌸</a>
  <a href="series.html" class="sidebar-btn" title="Séries">📺</a>
  <a href="movies.html" class="sidebar-btn" title="Films">🎬</a>
</nav>

<div class="main-wrapper">
  <div class="container">
    <div class="cats-banner">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdW4wcWVzeGF2Ynl4MG5oZWdpMWNva2I4bzh4bmR6eW5ubm1mbnZ4eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JPxQXjEFA4r3W/giphy.gif" class="cat-gif" alt="Cat 1">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1eHN3aXF6NWY5ZDcxOHUzaXkxaXFwOW16bWNwMHdqdHJrbjB2eiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/CjmvTCZf2U3p09Cn0h/giphy.gif" class="cat-gif" alt="Cat 2">
    </div>

    <div class="site-header">
      <h1>What's next ?</h1>
      <div class="site-subtitle">Accueil</div>
    </div>

    <div id="toolbarLayout" class="toolbar-layout">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Recherche globale (Jeux, Animés, Séries, Films...)" autocomplete="off">
        <button id="resetBtn" class="btn-reset" title="Réinitialiser">✕</button>
        <div id="autocompleteList" class="autocomplete-list"></div>
      </div>

      <div class="type-switch" id="typeSwitch">
        <button type="button" class="type-btn active" data-mode="ALL">Tous</button>
        <button type="button" class="type-btn" data-mode="GAMES">Jeux</button>
        <button type="button" class="type-btn" data-mode="ANIME">Animés</button>
        <button type="button" class="type-btn" data-mode="SERIES">Séries</button>
        <button type="button" class="type-btn" data-mode="MOVIES">Films</button>
      </div>
    </div>
  </div>

  <div class="results-scroll-area" id="resultsScrollArea">
    <div class="pull-refresh-indicator" id="pullRefreshIndicator">🔄 Glisse pour rafraîchir</div>
    <div id="status" class="status"></div>
    <div id="resultsContainer"></div>
  </div>
</div>

<script>
  window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'set-theme') {
      document.documentElement.setAttribute('data-theme', event.data.theme);
    }
  });

  const searchInput = document.getElementById('searchInput');
  const typeButtons = document.querySelectorAll('.type-btn');
  const resetBtn = document.getElementById('resetBtn');
  const autocompleteList = document.getElementById('autocompleteList');
  const resultsContainer = document.getElementById('resultsContainer');
  const resultsScrollArea = document.getElementById('resultsScrollArea');
  const pullRefreshIndicator = document.getElementById('pullRefreshIndicator');
  const status = document.getElementById('status');

  let currentMode = 'ALL';
  let debounceTimer;

  // --- LOGIQUE PULL TO REFRESH ---
  let startY = 0;
  let currentY = 0;
  let isPulling = false;
  const PULL_THRESHOLD = 70;

  resultsScrollArea.addEventListener('touchstart', (e) => {
    if (resultsScrollArea.scrollTop === 0) {
      startY = e.touches[0].clientY;
      isPulling = true;
    }
  }, { passive: true });

  resultsScrollArea.addEventListener('touchmove', (e) => {
    if (!isPulling) return;
    currentY = e.touches[0].clientY;
    const diff = currentY - startY;

    if (diff > 0 && resultsScrollArea.scrollTop === 0) {
      const height = Math.min(diff * 0.4, PULL_THRESHOLD);
      pullRefreshIndicator.style.height = `${height}px`;
      pullRefreshIndicator.classList.add('visible');
      if (height >= PULL_THRESHOLD) {
        pullRefreshIndicator.innerText = '⌛ Relâche pour rafraîchir';
      } else {
        pullRefreshIndicator.innerText = '🔄 Glisse pour rafraîchir';
      }
    }
  }, { passive: true });

  resultsScrollArea.addEventListener('touchend', () => {
    if (!isPulling) return;
    isPulling = false;
    const diff = currentY - startY;

    if (diff >= PULL_THRESHOLD && resultsScrollArea.scrollTop === 0) {
      pullRefreshIndicator.innerText = '⚡ Rafraîchissement...';
      setTimeout(() => {
        resetSearch();
        pullRefreshIndicator.style.height = '0px';
        pullRefreshIndicator.classList.remove('visible');
      }, 400);
    } else {
      pullRefreshIndicator.style.height = '0px';
      pullRefreshIndicator.classList.remove('visible');
    }
    startY = 0; currentY = 0;
  });

  // --- LOGIQUE DE RECHERCHE & NAVIGATION ---
  typeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      typeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.getAttribute('data-mode');
      if (searchInput.value.trim().length >= 2) {
        triggerSearch();
      }
    });
  });

  function renderWelcomeScreen() {
    resultsContainer.innerHTML = `
      <div class="welcome-card">
        <div class="welcome-title">Bienvenue sur What's next ?</div>
        <div class="welcome-text">Explore tes jeux vidéo, animés, séries et films préférés en un seul endroit.<br>Utilise la barre de recherche ci-dessus pour commencer.</div>
      </div>
    `;
  }

  function resetSearch() {
    searchInput.value = '';
    resetBtn.style.display = 'none';
    autocompleteList.style.display = 'none';
    status.innerText = '';
    renderWelcomeScreen();
  }

  resetBtn.addEventListener('click', resetSearch);

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const rawQuery = searchInput.value.trim();
    if (rawQuery.length < 2) {
      autocompleteList.style.display = 'none';
      if (rawQuery.length === 0) {
        resetBtn.style.display = 'none';
        renderWelcomeScreen();
      }
      return;
    }
    resetBtn.style.display = 'flex';
    debounceTimer = setTimeout(triggerSearch, 300);
  });

  async function triggerSearch() {
    const rawQuery = searchInput.value.trim();
    if (rawQuery.length < 2) return;

    status.innerText = 'Recherche en cours...';
    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(rawQuery)}&type=${currentMode}`);
      if (!res.ok) throw new Error(`Erreur HTTP ${res.status}`);
      const data = await res.json();
      status.innerText = '';
      renderGlobalResults(data.results || []);
    } catch (e) {
      console.error(e);
      status.innerText = 'Recherche terminée ou indisponible.';
    }
  }

  function renderGlobalResults(items) {
    resultsContainer.innerHTML = '';
    if (items.length === 0) {
      resultsContainer.innerHTML = '<div style="text-align:center; color:var(--muted); padding:16px;">Aucun résultat trouvé.</div>';
      return;
    }

    const section = document.createElement('div');
    section.className = 'year-section open';
    section.innerHTML = `
      <div class="year-header"><span>Résultats de recherche <span class="count">(${items.length})</span></span></div>
      <div class="year-content grid-layout" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px;"></div>
    `;
    const grid = section.querySelector('.year-content');

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      const fallbackSvg = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='150' viewBox='0 0 100 150'><rect width='100%' height='100%' fill='%23334155'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%2394a3b8' font-size='12'>N/A</text></svg>`;
      
      card.innerHTML = `
        <div class="card-img-wrapper">
          <img src="${item.image || fallbackSvg}" alt="${item.title || item.name}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackSvg}';">
        </div>
        <div class="card-body">
          <div class="card-title">${item.title || item.name}</div>
          <div class="card-genres">${item.type || ''}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    resultsContainer.appendChild(section);
  }

  renderWelcomeScreen();
</script>
</body>
</html>
