<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Sidebar rétractable au survol */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 70px;
      height: 100vh;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }
    .sidebar:hover {
      width: 240px;
    }
    .sidebar-header {
      padding: 20px 18px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 10px 0;
      flex: 1;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .sidebar-item:hover, .sidebar-item.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.15);
    }
    .sidebar-icon {
      font-size: 22px;
      min-width: 24px;
      text-align: center;
    }

    /* Zone de contenu principale */
    .main-content {
      margin-left: 70px;
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      padding: 20px;
      box-sizing: border-box;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Vues / Modules */
    .view {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
    }
    .view.active {
      display: block;
    }

    /* Style de la page d'accueil par défaut */
    .welcome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-top: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .welcome-card h2 { color: #fff; margin-top: 0; }
  </style>
</head>
<body>

  <!-- Barre latérale -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-icon">🚀</span>
      <span>Mon Hub</span>
    </div>
    <ul class="sidebar-menu">
      <li class="sidebar-item active" onclick="switchView('home', this)">
        <span class="sidebar-icon">🏠</span>
        <span>Accueil</span>
      </li>
      <li class="sidebar-item" onclick="switchView('anime', this)">
        <span class="sidebar-icon">🎬</span>
        <span>Animes & Mangas</span>
      </li>
    </ul>
  </nav>

  <!-- Contenu principal -->
  <main class="main-content">
    
    <!-- Vue Accueil (Par défaut) -->
    <div id="home" class="view active">
      <div class="welcome-card">
        <h2>Bienvenue sur ton tableau de bord</h2>
        <p style="color: var(--muted);">Sélectionne un module dans la barre de gauche pour commencer.</p>
      </div>
    </div>

    <!-- Vue Module Animes -->
    <div id="anime" class="view">
      <iframe src="modules/animes_mangas.html" style="width: 100%; height: calc(100vh - 40px); border: none; background: transparent;"></iframe>
    </div>

  </main>

  <script>
    function switchView(viewId, element) {
      document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }
  </script>

</body>
</html>
