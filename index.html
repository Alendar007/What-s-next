<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>What's next ?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    html, body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-tap-highlight-color: transparent;
    }

    /* En-tête avec le nom du site centré, sans les icônes */
    .top-header {
      height: 50px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 1001;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }
    .top-header h1 {
      color: #fff;
      font-size: 18px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Layout principal */
    .app-layout {
      display: flex;
      min-height: calc(100vh - 50px);
    }

    /* Sidebar fixe très fine */
    .sidebar {
      width: 44px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Élément du menu avec effet Overlay au survol */
    .sidebar-item {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .sidebar-item:hover, .sidebar-item.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.2);
    }

    /* Icône */
    .sidebar-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .sidebar-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      /* Rend le fond blanc de la favicon PNG complètement transparent */
      mix-blend-mode: screen;
      filter: contrast(150%) brightness(1.2);
    }

    /* Infobulle overlay qui apparaît au survol sans élargir la barre */
    .sidebar-overlay {
      position: absolute;
      left: 54px;
      top: 50%;
      transform: translateY(-50%) translateX(-6px);
      background: var(--card-bg);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
      z-index: 1002;
    }
    .sidebar-item:hover .sidebar-overlay {
      opacity: 1;
      visibility: visible;
      transform: translateY(-50%) translateX(0);
    }

    /* Zone de contenu principale */
    .main-content {
      flex: 1;
      padding: 24px;
      box-sizing: border-box;
    }

    /* Vues / Modules */
    .view {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
    }
    .view.active {
      display: block;
    }

    /* Page d'accueil épurée, gros titre sans encart */
    .welcome-container {
      text-align: center;
      margin-top: 80px;
      padding: 0 20px;
    }
    .welcome-container h2 {
      color: #fff;
      font-size: 38px;
      font-weight: 800;
      margin: 0 0 14px 0;
      letter-spacing: -0.5px;
    }
    .welcome-container p {
      color: var(--muted);
      font-size: 17px;
      margin: 0;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <h1>What's next ?</h1>
  </header>

  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-item active" id="btn-home" onclick="switchView('home', this)">
        <div class="sidebar-icon">
          <img src="favicon.png" alt="Accueil">
        </div>
        <div class="sidebar-overlay">Accueil</div>
      </div>

      <div class="sidebar-item" id="btn-anime" onclick="switchView('anime', this)">
        <div class="sidebar-icon">
          <!-- Tête de manga en pixel art SVG transparent -->
          <svg viewBox="0 0 16 16" width="100%" height="100%" fill="currentColor">
            <path d="M3 2h10v1H3zm0 1h1v1H3zm9 0h1v1h-1zM2 4h12v1H2zm0 1h1v2H2zm12 0h1v2h-1zM4 6h8v1H4zm1 1h2v1H5zm4 0h2v1H9zM3 8h10v1H3zm0 1h1v4H3zm10 0h1v4h-1zM5 13h6v1H5z"/>
          </svg>
        </div>
        <div class="sidebar-overlay">Animes & Mangas</div>
      </div>
    </nav>

    <main class="main-content">
      <div id="home" class="view">
        <div class="welcome-container">
          <h2>Tableau de bord</h2>
          <p>Sélectionne un module dans le menu de gauche.</p>
        </div>
      </div>

      <div id="anime" class="view">
        <iframe src="modules/animes_mangas.html" style="width: 100%; height: 85vh; border: none; background: transparent;"></iframe>
      </div>
    </main>
  </div>

  <script>
    function switchView(viewId, element, save = true) {
      document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      if (save) {
        localStorage.setItem('activeView', viewId);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedView = localStorage.getItem('activeView');
      if (savedView && document.getElementById(savedView)) {
        const targetBtn = document.getElementById('btn-' + savedView);
        if (targetBtn) {
          switchView(savedView, targetBtn, false);
        }
      } else {
        switchView('home', document.getElementById('btn-home'), false);
      }
    });
  </script>

</body>
</html>
