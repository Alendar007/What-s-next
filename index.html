<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>What's next ?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🎬</text></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-format: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .site-header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      color: #fff;
      font-size: 26px;
      margin: 0 0 6px 0;
    }
    .site-subtitle {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    
    .search-box {
      display: flex;
      gap: 10px;
      position: relative;
      margin-bottom: 20px;
    }
    select, input {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    select { width: 110px; flex-shrink: 0; }
    input { flex: 1; width: 100%; box-sizing: border-box; }
    
    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: none;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-reset:hover { color: #fff; border-color: var(--accent); }
    
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 120px;
      right: 50px;
      margin-top: 4px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 8px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    @media (max-width: 500px) { .autocomplete-list { left: 0; right: 0; } }
    .autocomplete-item { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: var(--accent); }

    /* Hero Banner avec de vraies images de personnages gérées par proxy */
    .hero-banner {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 20px;
    }
    @media (max-width: 550px) {
      .hero-banner { flex-direction: column; text-align: center; }
    }
    .hero-img {
      width: 130px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      background: var(--card-bg);
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .hero-info h2 { margin: 0 0 6px 0; color: #fff; font-size: 19px; }
    .hero-quote { font-style: italic; color: var(--accent); margin-bottom: 8px; font-size: 14px; }
    .hero-desc { font-size: 13px; color: var(--muted); line-height: 1.4; }

    .controls-bar { margin-bottom: 20px; display: none; }
    .sort-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .sort-control { display: flex; flex-direction: column; gap: 8px; }
    .sort-control label { font-size: 13px; font-weight: bold; color: var(--muted); text-transform: uppercase; }
    .sort-control select { padding: 10px 14px; font-size: 14px; width: 100%; }
    
    .btn-toggle-filters {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
    }
    .btn-toggle-filters:hover { border-color: var(--accent); }

    .filters-wrapper { background: var(--card-bg); border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; padding: 16px; display: none; }
    .filters-wrapper.open { display: block; }
    .filter-section { margin-bottom: 12px; }
    .filter-section:last-child { margin-bottom: 0; }
    .filter-title { font-size: 12px; font-weight: bold; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .filter-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { background: #0f172a; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .tag-genre.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tag-format.active { background: var(--accent-format); border-color: var(--accent-format); color: #fff; }

    .year-section { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card-bg); }
    .year-header { padding: 14px 16px; background: #1a2332; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .year-header:hover { background: #232d3f; }
    .year-header .count { font-size: 13px; color: var(--muted); font-weight: normal; }
    .year-content { padding: 16px; display: none; }
    .year-section.open .year-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .year-section.open .arrow { transform: rotate(180deg); }
    .arrow { transition: transform 0.2s; font-size: 12px; }
    .flat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }

    .card { background: #0f172a; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card-cover { width: 100%; height: 210px; background: var(--card-bg); overflow: hidden; }
    .card-cover img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 10px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #fff; }
    .card-format-badge { display: inline-block; align-self: flex-start; font-size: 10px; font-weight: bold; background: #334155; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; }
    .card-genres { font-size: 10px; color: var(--accent); margin-bottom: 8px; }
    .card-meta { font-size: 11px; color: var(--muted); margin-top: auto; }

    .modal-backdrop { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); 
      display: flex; justify-content: center; align-items: flex-end; 
      z-index: 200; padding: 0; box-sizing: border-box;
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-backdrop.show { opacity: 1; visibility: visible; }
    
    .modal-card { 
      background: var(--card-bg); border: 1px solid var(--border); border-bottom: none;
      border-radius: 20px 20px 0 0; max-width: 650px; width: 100%; max-height: 90vh; 
      position: relative; display: flex; flex-direction: column; 
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .modal-backdrop.show .modal-card { transform: translateY(0); }
    
    @media (min-width: 600px) {
      .modal-backdrop { align-items: center; padding: 16px; }
      .modal-card { border-radius: 12px; border-bottom: 1px solid var(--border); max-height: 85vh; }
    }

    .modal-handle-area {
      width: 100%; padding: 16px 0; display: flex; justify-content: center;
      cursor: grab; position: sticky; top: 0; background: var(--card-bg); z-index: 10;
      border-radius: 20px 20px 0 0; touch-action: none;
    }
    .modal-handle-area:active { cursor: grabbing; }
    .drag-handle { width: 48px; height: 6px; background: #475569; border-radius: 4px; }
    
    .modal-scrollable { overflow-y: auto; padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
    @media (min-width: 550px) { .modal-scrollable { flex-direction: row; } }
    
    .modal-cover { width: 130px; height: 180px; border-radius: 8px; object-fit: cover; align-self: flex-start; background: var(--card-bg); }
    .modal-info { flex: 1; }
    .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; color: #fff; }
    .modal-description { font-size: 12px; line-height: 1.5; color: #cbd5e1; margin: 12px 0; max-height: 140px; overflow-y: auto; }
    .modal-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn-link { background: var(--accent); color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; }

    .status { text-align: center; margin-top: 20px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="site-header">
    <h1>What's next ?</h1>
    <div class="site-subtitle">Animés & Mangas</div>
  </div>

  <div class="search-box">
    <select id="mediaType">
      <option value="ANIME">Anime</option>
      <option value="MANGA">Manga</option>
    </select>
    <input type="text" id="searchInput" placeholder="Titre puis Entrée (ex: Bleach...)" autocomplete="off">
    <button id="resetBtn" class="btn-reset" title="Retour à l'accueil">⌂</button>
    <div id="autocompleteList" class="autocomplete-list"></div>
  </div>

  <div id="heroBanner" class="hero-banner">
    <img id="heroImg" class="hero-img" src="" alt="Personnage">
    <div class="hero-info">
      <h2 id="heroName"></h2>
      <div id="heroQuote" class="hero-quote"></div>
      <div id="heroDesc" class="hero-desc"></div>
    </div>
  </div>

  <div id="controlsBar" class="controls-bar">
    <div class="sort-bar">
      <div class="sort-control">
        <label for="sortMode">Trier les recommandations par :</label>
        <select
