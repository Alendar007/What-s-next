<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>What's next ?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-format: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --accent: #4f46e5;
      --accent-format: #059669;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .container { max-width: 1000px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    
    .site-header { text-align: center; margin-bottom: 16px; }
    h1 { color: var(--text); font-size: 22px; margin: 0 0 4px 0; }
    .site-subtitle { color: var(--muted); font-size: 13px; font-weight: 500; }
    
    .search-box { 
      display: flex; 
      gap: 6px; 
      position: relative; 
      margin-bottom: 16px; 
      width: 100%;
    }
    select, input { 
      padding: 8px 10px; 
      border-radius: 8px; 
      border: 1px solid var(--border); 
      background: var(--card-bg); 
      color: var(--text); 
      font-size: 13px; 
      outline: none; 
      box-sizing: border-box;
    }
    select { width: 90px; flex-shrink: 0; }
    input { flex: 1; min-width: 0; }
    
    .btn-reset {
      background: transparent; 
      border: 1px solid var(--border); 
      color: var(--muted); 
      padding: 0 10px;
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 14px; 
      display: none; 
      align-items: center; 
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-reset:hover { color: var(--text); border-color: var(--accent); }
    
    .autocomplete-list {
      position: absolute; top: 100%; left: 96px; right: 0; margin-top: 4px;
      background: var(--card-bg); border: 1px solid var(--accent); border-radius: 8px;
      max-height: 220px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    @media (max-width: 500px) { .autocomplete-list { left: 0; right: 0; } }
    .autocomplete-item { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); font-size: 13px; }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: var(--accent); color: #fff; }

    .hero-banner { background: transparent; padding: 6px 0 14px 0; display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 550px) { .hero-banner { flex-direction: column; text-align: center; } }
    
    .hero-avatar { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: var(--card-bg); flex-shrink: 0; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; }
    .hero-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
    
    .hero-info h2 { margin: 0 0 4px 0; color: var(--text); font-size: 16px; }
    .hero-quote { font-style: italic; color: var(--accent); margin-bottom: 4px; font-size: 13px; }
    .hero-desc { font-size: 12px; color: var(--muted); line-height: 1.4; }

    .controls-bar { margin-bottom: 16px; display: none; }
    .sort-bar { display: flex; flex-direction: column; gap: 10px; background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .sort-control { display: flex; flex-direction: column; gap: 6px; }
    .sort-control label { font-size: 12px; font-weight: bold; color: var(--muted); text-transform: uppercase; }
    .sort-control select { padding: 8px 10px; font-size: 13px; width: 100%; }
    
    .btn-toggle-filters {
      background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; box-sizing: border-box;
    }
    .btn-toggle-filters:hover { border-color: var(--accent); }

    .filters-wrapper { background: var(--card-bg); border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; padding: 12px; display: none; }
    .filters-wrapper.open { display: block; }
    .filter-section { margin-bottom: 10px; }
    .filter-section:last-child { margin-bottom: 0; }
    .filter-title { font-size: 11px; font-weight: bold; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    .filter-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: var(--bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 16px; font-size: 12px; cursor: pointer; color: var(--text); }
    .tag-genre.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tag-format.active { background: var(--accent-format); border-color: var(--accent-format); color: #fff; }

    .year-section { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card-bg); }
    .year-header { padding: 10px 14px; background: var(--card-bg); font-weight: bold; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; border-bottom: 1px solid var(--border); color: var(--text); }
    .year-header:hover { opacity: 0.8; }
    .year-header .count { font-size: 12px; color: var(--muted); font-weight: normal; }
    .year-content { padding: 12px; display: none; }
    .year-section.open .year-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .year-section.open .arrow { transform: rotate(180deg); }
    .arrow { transition: transform 0.2s; font-size: 11px; }
    .flat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

    .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card-img-wrapper { width: 100%; height: 200px; overflow: hidden; background: var(--border); }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 8px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-weight: bold; font-size: 12px; margin-bottom: 4px; color: var(--text); }
    .card-format-badge { display: inline-block; align-self: flex-start; font-size: 9px; font-weight: bold; background: var(--border); color: var(--text); padding: 2px 5px; border-radius: 4px; margin-bottom: 4px; }
    .card-genres { font-size: 10px; color: var(--accent); margin-bottom: 6px; }
    .card-meta { font-size: 10px; color: var(--muted); margin-top: auto; }

    .modal-backdrop { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); 
      display: flex; justify-content: center; align-items: flex-end; 
      z-index: 200; padding: 0; box-sizing: border-box;
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-backdrop.show { opacity: 1; visibility: visible; }
    
    .modal-card { 
      background: var(--card-bg); border: 1px solid var(--border); border-bottom: none;
      border-radius: 16px 16px 0 0; max-width: 600px; width: 100%; max-height: 85vh; 
      position: relative; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
      transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .modal-backdrop.show .modal-card { transform: translateY(0); }
    
    @media (min-width: 600px) {
      .modal-backdrop { align-items: center; padding: 16px; }
      .modal-card { border-radius: 12px; border-bottom: 1px solid var(--border); max-height: 80vh; }
    }

    .modal-handle-area { width: 100%; padding: 12px 0; display: flex; justify-content: center; cursor: grab; position: sticky; top: 0; background: var(--card-bg); z-index: 10; border-radius: 16px 16px 0 0; touch-action: none; }
    .drag-handle { width: 40px; height: 5px; background: var(--muted); border-radius: 4px; }
    
    .modal-scrollable { overflow-y: auto; padding: 0 16px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
    @media (min-width: 550px) { .modal-scrollable { flex-direction: row; } }
    
    .modal-cover { width: 130px; border-radius: 8px; object-fit: cover; align-self: flex-start; }
    .modal-info { flex: 1; }
    .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; color: var(--text); }
    .modal-description { font-size: 11px; line-height: 1.4; color: var(--muted); margin: 10px 0; max-height: 130px; overflow-y: auto; }
    .modal-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .btn-link { background: var(--accent); color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }

    .status { text-align: center; margin-top: 16px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <div class="site-header">
    <h1>What's next ?</h1>
    <div class="site-subtitle">Animés & Mangas</div>
  </div>

  <div class="search-box">
    <select id="mediaType">
      <option value="ANIME">Anime</option>
      <option value="MANGA">Manga</option>
    </select>
    <input type="text" id="searchInput" placeholder="Titre (ex: Bleach...)" autocomplete="off">
    <button id="resetBtn" class="btn-reset" title="Réinitialiser">✕</button>
    <div id="autocompleteList" class="autocomplete-list"></div>
  </div>

  <div id="heroBanner" class="hero-banner">
    <div class="hero-avatar" id="heroAvatar"></div>
    <div class="hero-info">
      <h2 id="heroName">Chargement...</h2>
      <div id="heroQuote" class="hero-quote"></div>
      <div id="heroDesc" class="hero-desc"></div>
    </div>
  </div>

  <div id="controlsBar" class="controls-bar">
    <div class="sort-bar">
      <div class="sort-control">
        <label for="sortMode">Trier les recommandations par :</label>
        <select id="sortMode">
          <option value="YEAR_DESC">📅 Année (récent ➔ ancien)</option>
          <option value="SCORE_DESC">⭐ Meilleure note</option>
        </select>
      </div>
      <button id="toggleFiltersBtn" class="btn-toggle-filters">⚙️ Plus de filtres</button>
    </div>

    <div id="filtersWrapper" class="filters-wrapper">
      <div class="filter-section">
        <div class="filter-title">Formats :</div>
        <div id="formatTags" class="filter-tags"></div>
      </div>
      <div class="filter-section" style="margin-top: 10px;">
        <div class="filter-title">Genres :</div>
        <div id="genreTags" class="filter-tags"></div>
      </div>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="resultsContainer"></div>
</div>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal-card" id="modalCard">
    <div class="modal-handle-area" id="modalHandleArea">
      <div class="drag-handle"></div>
    </div>
    <div class="modal-scrollable">
      <img id="modalImg" class="modal-cover" src="" alt="Cover">
      <div class="modal-info">
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalMeta" style="font-size: 11px; color: var(--muted);"></div>
        <div id="modalGenres" style="font-size: 10px; color: var(--accent); margin-top: 4px;"></div>
        <div id="modalDesc" class="modal-description"></div>
        <div style="font-size: 11px; font-weight: bold; color: var(--muted); margin-bottom: 4px;">Plateformes & Liens :</div>
        <div id="modalLinks" class="modal-links"></div>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'set-theme') {
      document.documentElement.setAttribute('data-theme', event.data.theme);
    }
  });

  const ANILIST_URL = 'https://graphql.anilist.co';

  const HERO_POOL = [
    { name: "Satoru Gojo", quote: "« Ne t'inquiète pas, je suis le plus fort. »", desc: "Sélectionne n'importe quelle série pour générer son graphe de recommandation.", id: 127448 },
    { name: "Faye Valentine", quote: "« Tu sais ce qu'on dit : à la guerre comme à la guerre ! »", desc: "Tape un titre dans la barre ci-dessus pour dénicher des œuvres similaires.", id: 2 },
    { name: "Asuka Langley", quote: "« Quoi ? Tu n'as toujours pas choisi d'anime à rechercher ?! »", desc: "Trouve immédiatement des recommandations basées sur les votes de la communauté.", id: 1211 },
    { name: "Lelouch vi Britannia", quote: "« Si le roi ne bouge pas, ses sujets ne le suivront pas. »", desc: "Prépare-toi à découvrir des pépites scénaristiques inoubliables.", id: 45 },
    { name: "Levi Ackerman", quote: "« Le seul choix qu'il nous reste est de croire en nous-mêmes. »", desc: "Filtre par notes et par années pour cibler direct tes prochains visionnages.", id: 45942 },
    { name: "Monkey D. Luffy", quote: "« Je serai le roi des pirates ! »", desc: "Explore des milliers de suggestions adaptées à tes goûts.", id: 40 },
    { name: "Tanjiro Kamado", quote: "« Ne baisse jamais les bras, même si c'est dur. »", desc: "Trouve ta prochaine claque visuelle en quelques secondes.", id: 128443 },
    { name: "Light Yagami", quote: "« Je suis la justice ! »", desc: "Déniche des thrillers psychologiques d'exception.", id: 80 }
  ];

  const searchInput = document.getElementById('searchInput');
  const mediaType = document.getElementById('mediaType');
  const resetBtn = document.getElementById('resetBtn');
  const autocompleteList = document.getElementById('autocompleteList');
  
  const heroBanner = document.getElementById('heroBanner');
  const heroAvatar = document.getElementById('heroAvatar');
  const heroName = document.getElementById('heroName');
  const heroQuote = document.getElementById('heroQuote');
  const heroDesc = document.getElementById('heroDesc');

  const controlsBar = document.getElementById('controlsBar');
  const toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
  const filtersWrapper = document.getElementById('filtersWrapper');
  const sortMode = document.getElementById('sortMode');
  const resultsContainer = document.getElementById('resultsContainer');
  const status = document.getElementById('status');

  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalCard = document.getElementById('modalCard');
  const modalHandleArea = document.getElementById('modalHandleArea');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalMeta = document.getElementById('modalMeta');
  const modalGenres = document.getElementById('modalGenres');
  const modalDesc = document.getElementById('modalDesc');
  const modalLinks = document.getElementById('modalLinks');

  let rawRecommendations = [];
  let selectedGenres = new Set();
  let selectedFormats = new Set();
  let debounceTimer;

  async function initHero() {
    try {
      const selected = HERO_POOL[Math.floor(Math.random() * HERO_POOL.length)];
      heroQuote.innerText = selected.quote;
      heroDesc.innerText = selected.desc;
      heroAvatar.innerHTML = '<span style="font-size:20px">🐈‍⬛</span>';
      
      const query = `
        query ($id: Int) {
          Character (id: $id) {
            name { full }
            image { large }
            media(perPage: 1, sort: POPULARITY_DESC) {
              nodes { title { romaji english } }
            }
          }
        }
      `;
      const response = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { id: selected.id } })
      });
      const data = await response.json();
      const char = data.data.Character;

      if (char) {
        const mediaNode = char.media.nodes[0];
        const animeTitle = mediaNode ? (mediaNode.title.english || mediaNode.title.romaji) : '';
        heroName.innerText = animeTitle ? `${char.name.full} (${animeTitle})` : char.name.full;
        
        if (char.image && char.image.large) {
          heroAvatar.innerHTML = '';
          const img = document.createElement('img');
          img.alt = char.name.full;
          img.src = char.image.large;
          heroAvatar.appendChild(img);
        }
      } else {
        heroName.innerText = selected.name;
      }
      heroBanner.style.display = 'flex';
      resetBtn.style.display = 'none';
    } catch (e) {
      console.error(e);
      heroName.innerText = "Bienvenue";
    }
  }
  initHero();

  resetBtn.addEventListener('click', () => {
    searchInput.value = '';
    resultsContainer.innerHTML = '';
    controlsBar.style.display = 'none';
    status.innerText = '';
    initHero();
    resetBtn.style.display = 'none';
  });

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const query = searchInput.value.trim();
    if (query.length < 2) {
      autocompleteList.style.display = 'none';
      return;
    }
    debounceTimer = setTimeout(() => fetchAutocomplete(query), 300);
  });

  searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      autocompleteList.style.display = 'none';
      const query = searchInput.value.trim();
      if (query) searchMedia(query);
    }
  });

  async function fetchAutocomplete(search) {
    const type = mediaType.value;
    const query = `
      query ($search: String, $type: MediaType) {
        Page (perPage: 6) {
          media (search: $search, type: $type, sort: [POPULARITY_DESC]) {
            id
            title { romaji english }
            coverImage { large }
            format
            startDate { year }
          }
        }
      }
    `;
    try {
      const res = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { search, type } })
      });
      const data = await res.json();
      const items = data.data.Page.media;
      
      autocompleteList.innerHTML = '';
      if (items.length === 0) {
        autocompleteList.style.display = 'none';
        return;
      }

      items.forEach(item => {
        const title = item.title.english || item.title.romaji;
        const div = document.createElement('div');
        div.className = 'autocomplete-item';
        div.innerHTML = `<span>${title}</span> <span style="font-size:11px; color:var(--muted);">${item.startDate?.year || ''}</span>`;
        div.addEventListener('click', () => {
          searchInput.value = title;
          autocompleteList.style.display = 'none';
          searchMedia(title);
        });
        autocompleteList.appendChild(div);
      });
      autocompleteList.style.display = 'block';
    } catch (err) {
      console.error(err);
    }
  }

  async function searchMedia(search) {
    autocompleteList.style.display = 'none';
    heroBanner.style.display = 'none';
    controlsBar.style.display = 'none';
    resultsContainer.innerHTML = '';
    status.innerText = `Chargement des recommandations pour "${search}"...`;
    resetBtn.style.display = 'flex';

    const type = mediaType.value;
    const query = `
      query ($search: String, $type: MediaType) {
        Media (search: $search, type: $type) {
          id
          title { romaji english }
          recommendations (sort: [RATING_DESC]) {
            nodes {
              mediaRecommendation {
                id
                title { romaji english }
                coverImage { large }
                averageScore
                format
                genres
                startDate { year }
                description
                siteUrl
                externalLinks { site url }
              }
            }
          }
        }
      }
    `;

    try {
      const res = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { search, type } })
      });
      const data = await res.json();
      
      if (!data.data || !data.data.Media) {
        status.innerText = "Aucun résultat trouvé.";
        return;
      }

      const recs = data.data.Media.recommendations.nodes;
      rawRecommendations = recs.map(n => n.mediaRecommendation).filter(Boolean);

      if (rawRecommendations.length === 0) {
        status.innerText = "Aucune recommandation disponible pour ce titre.";
        return;
      }

      status.innerText = '';
      buildFilters();
      renderResults();
      controlsBar.style.display = 'block';
    } catch (err) {
      console.error(err);
      status.innerText = "Erreur lors de la récupération des données.";
    }
  }

  function buildFilters() {
    const formatsSet = new Set();
    const genresSet = new Set();

    rawRecommendations.forEach(item => {
      if (item.format) formatsSet.add(item.format);
      if (item.genres) item.genres.forEach(g => genresSet.add(g));
    });

    formatTags.innerHTML = '';
    selectedFormats.clear();
    formatsSet.forEach(fmt => {
      const tag = document.createElement('div');
      tag.className = 'tag tag-format';
      tag.innerText = fmt.replace('_', ' ');
      tag.addEventListener('click', () => {
        if (selectedFormats.has(fmt)) selectedFormats.delete(fmt);
        else selectedFormats.add(fmt);
        tag.classList.toggle('active');
        renderResults();
      });
      formatTags.appendChild(tag);
    });

    genreTags.innerHTML = '';
    selectedGenres.clear();
    genresSet.forEach(genre => {
      const tag = document.createElement('div');
      tag.className = 'tag tag-genre';
      tag.innerText = genre;
      tag.addEventListener('click', () => {
        if (selectedGenres.has(genre)) selectedGenres.delete(genre);
        else selectedGenres.add(genre);
        tag.classList.toggle('active');
        renderResults();
      });
      genreTags.appendChild(tag);
    });
  }

  function renderResults() {
    let filtered = rawRecommendations.filter(item => {
      if (selectedFormats.size > 0 && (!item.format || !selectedFormats.has(item.format))) return false;
      if (selectedGenres.size > 0) {
        const matches = [...selectedGenres].every(g => item.genres && item.genres.includes(g));
        if (!matches) return false;
      }
      return true;
    });

    const mode = sortMode.value;
    filtered.sort((a, b) => {
      if (mode === 'SCORE_DESC') {
        return (b.averageScore || 0) - (a.averageScore || 0);
      } else {
        const yearA = a.startDate?.year || 0;
        const yearB = b.startDate?.year || 0;
        return yearB - yearA;
      }
    });

    resultsContainer.innerHTML = '';

    if (filtered.length === 0) {
      resultsContainer.innerHTML = '<div style="text-align:center; color:var(--muted); padding: 20px;">Aucun anime ne correspond à ces filtres.</div>';
      return;
    }

    if (sortMode.value === 'YEAR_DESC') {
      const groups = {};
      filtered.forEach(item => {
        const year = item.startDate?.year || 'Inconnue';
        if (!groups[year]) groups[year] = [];
        groups[year].push(item);
      });

      const sortedYears = Object.keys(groups).sort((a, b) => b - a);

      sortedYears.forEach(year => {
        const items = groups[year];
        const section = document.createElement('div');
        section.className = 'year-section open';

        const header = document.createElement('div');
        header.className = 'year-header';
        header.innerHTML = `<span>Année ${year} <span class="count">(${items.length})</span></span><span class="arrow">▼</span>`;
        
        const content = document.createElement('div');
        content.className = 'year-content';

        header.addEventListener('click', () => {
          section.classList.toggle('open');
        });

        items.forEach(item => content.appendChild(createCard(item)));
        section.appendChild(header);
        section.appendChild(content);
        resultsContainer.appendChild(section);
      });
    } else {
      const grid = document.createElement('div');
      grid.className = 'flat-grid';
      filtered.forEach(item => grid.appendChild(createCard(item)));
      resultsContainer.appendChild(grid);
    }
  }

  function createCard(item) {
    const card = document.createElement('div');
    card.className = 'card';
    
    const title = item.title.english || item.title.romaji;
    const year = item.startDate?.year ? item.startDate.year : '';
    const format = item.format ? item.format.replace('_', ' ') : '';
    const genres = item.genres ? item.genres.slice(0, 2).join(' • ') : '';

    card.innerHTML = `
      <div class="card-img-wrapper">
        <img src="${item.coverImage.large}" alt="${title}" loading="lazy">
      </div>
      <div class="card-body">
        <span class="card-format-badge">${format}</span>
        <div class="card-title">${title}</div>
        <div class="card-genres">${genres}</div>
        <div class="card-meta">⭐ ${item.averageScore || 'N/A'} • ${year}</div>
      </div>
    `;

    card.addEventListener('click', () => openModal(item));
    return card;
  }

  toggleFiltersBtn.addEventListener('click', () => {
    filtersWrapper.classList.toggle('open');
    toggleFiltersBtn.innerText = filtersWrapper.classList.contains('open') ? '⚙️ Masquer les filtres' : '⚙️ Plus de filtres';
  });

  sortMode.addEventListener('change', () => {
    if (rawRecommendations.length > 0) renderResults();
  });

  let startY = 0;
  let currentY = 0;
  let isDragging = false;

  function onDragStart(e) {
    startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    isDragging = true;
    modalCard.style.transition = 'none';
  }

  function onDragMove(e) {
    if (!isDragging) return;
    const y = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    currentY = y - startY;
    if (currentY > 0) modalCard.style.transform = `translateY(${currentY}px)`;
  }

  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    modalCard.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)';
    if (currentY > 120) closeModal();
    else modalCard.style.transform = '';
    currentY = 0;
  }

  modalHandleArea.addEventListener('touchstart', onDragStart, {passive: true});
  modalHandleArea.addEventListener('touchmove', onDragMove, {passive: true});
  modalHandleArea.addEventListener('touchend', onDragEnd);
  modalHandleArea.addEventListener('mousedown', onDragStart);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);

  function openModal(item) {
    const title = item.title.english || item.title.romaji;
    modalImg.src = item.coverImage.large;
    modalTitle.innerText = title;
    
    const yearText = item.startDate && item.startDate.year ? item.startDate.year : 'N/A';
    const fmt = item.format ? item.format.replace('_', ' ') : 'N/A';
    modalMeta.innerText = `Format : ${fmt} | Année : ${yearText} | ⭐ Note : ${item.averageScore || 'N/A'}/100`;
    modalGenres.innerText = (item.genres || []).join(' • ');
    
    modalDesc.innerText = item.description ? item.description.replace(/<[^>]*>?/gm, '') : 'Aucune description disponible.';

    modalLinks.innerHTML = `<a href="${item.siteUrl}" target="_blank" class="btn-link">Fiche AniList</a>`;
    if (item.externalLinks && item.externalLinks.length > 0) {
      item.externalLinks.forEach(link => {
        const btn = document.createElement('a');
        btn.className = 'btn-link';
        btn.href = link.url;
        btn.target = '_blank';
        btn.innerText = link.site;
        modalLinks.appendChild(btn);
      });
    }

    modalCard.style.transform = ''; 
    modalBackdrop.classList.add('show');
  }

  function closeModal() {
    modalBackdrop.classList.remove('show');
    setTimeout(() => { modalCard.style.transform = ''; }, 350); 
  }

  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });
</script>
</body>
</html>
